name: CoasterVerse deploy check

on:
  push:
    branches: [coasterverse]

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install and generate catalog
        run: npm install
      - name: Validate catalog
        run: npm test
